<style>
/* VOICE: 105年続く大学ラグビー部の公式サイト。誠実で力強く，学生の日常も伝える。
   IDEA: マッチデー・プログラム。芝の縞と白線，スコアボードの数字。
   PICTURE: トップは芝の縞の上に「次の試合」スコアボードと今季目標。
   COLOUR and TYPE: 現行の緑 #00965E・黒・白に，部章の金を差し色。Zen Kaku Gothic New＋数字はOswald。
   LAYOUT: スマホ1カラム優先，900px以上で2〜3カラム。 */
:root{color-scheme:light dark;
--g:#00965E;--gd:#006b43;--gold:#F2C200;--k:#111;
--bg:light-dark(#ffffff,#0d1310);--bg2:light-dark(#f3f6f4,#141c17);--ink:light-dark(#121614,#e8eeea);
--mute:light-dark(#5b6660,#a2aea7);--line:light-dark(#dfe5e1,#25302a);--card:light-dark(#fff,#111914)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 "Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;overflow-x:clip}
a{color:inherit}
img{max-width:100%;display:block}
.band{padding:clamp(28px,5vw,64px) max(4vw,16px)}
.wrap{max-width:1180px;margin:0 auto}
h1,h2,h3{line-height:1.25;margin:0 0 10px;text-wrap:balance}
h2{font-size:clamp(22px,3vw,30px);font-weight:900}
h3{font-size:17px;font-weight:700}
.num{font-family:Oswald,"Zen Kaku Gothic New",sans-serif;font-variant-numeric:tabular-nums}
.mute{color:var(--mute)}.small{font-size:13px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.more{font-size:14px;color:var(--g);text-decoration:none;font-weight:700}
.more:hover{text-decoration:underline}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
/* header */
.top{position:sticky;top:0;z-index:20;background:var(--k);color:#fff;border-bottom:3px solid var(--gold)}
.top .in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:8px max(4vw,16px)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff;flex:1}
.brand svg,.brand img{width:46px;height:46px;flex:none;object-fit:contain}
.brand b{display:block;font-size:15px;line-height:1.2}.brand small{display:block;font-size:11px;color:#bcc6c0;line-height:1.3}
.gnav{display:flex;gap:2px}
.gnav a{color:#fff;text-decoration:none;font-size:14px;font-weight:700;padding:10px 10px;border-radius:4px;white-space:nowrap}
.gnav a:hover,.gnav a.on{background:var(--g)}
.menu-btn{display:none;background:none;border:2px solid #fff;color:#fff;border-radius:6px;min-width:44px;min-height:44px;font:inherit;font-size:13px;font-weight:700}
@media(max-width:980px){.gnav{display:none}.menu-btn{display:block}}
.drawer{position:fixed;inset:0;z-index:30;display:none}
.drawer.open{display:block}
.drawer .shade{position:absolute;inset:0;background:rgba(0,0,0,.5)}
.drawer nav{position:absolute;right:0;top:0;bottom:0;width:min(320px,86vw);background:var(--k);color:#fff;padding:16px;overflow:auto;border-left:4px solid var(--gold)}
.drawer nav a{display:block;color:#fff;text-decoration:none;padding:13px 10px;border-bottom:1px solid #2a2f2c;font-weight:700}
.drawer nav a small{display:block;font-weight:400;color:#9aa6a0;font-size:12px}
.drawer .close{float:right;background:none;border:2px solid #fff;color:#fff;border-radius:6px;min-width:44px;min-height:44px;font:inherit}
/* hero */
.hero{background:repeating-linear-gradient(90deg,#00965E 0 11%,#00895a 11% 22%);color:#fff;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.35));pointer-events:none}
.hero .lines{position:absolute;inset:0;pointer-events:none;opacity:.35}
.hero .wrap{position:relative;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:clamp(20px,4vw,48px);align-items:center}
@media(max-width:820px){.hero .wrap{grid-template-columns:minmax(0,1fr)}}
.hero .eyebrow{font-size:14px;color:#d8efe4;margin:0 0 6px}
.hero h1{font-size:clamp(30px,5.4vw,54px);font-weight:900;line-height:1.1;margin:0 0 12px}
.hero h1 span{display:block;font-size:.42em;font-weight:700;color:var(--gold);margin-bottom:8px}
.hero p{margin:0 0 16px;max-width:36em;color:#eaf6ef}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:10px 18px;border-radius:999px;font-weight:700;text-decoration:none;border:2px solid transparent;font:inherit;font-weight:700;cursor:pointer}
.btn.gold{background:var(--gold);color:#111}.btn.line{border-color:#fff;color:#fff;background:transparent}
.btn.green{background:var(--g);color:#fff}.btn.ghost{border-color:var(--g);color:var(--g);background:transparent}
.board{background:#0e0f0e;border:3px solid #fff;border-radius:10px;padding:16px 18px;box-shadow:0 18px 40px rgba(0,0,0,.35)}

.board .vs{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px;margin:8px 0}
.board .tm{font-weight:900;font-size:clamp(15px,2vw,19px);text-align:center}
.board .sc{font-size:clamp(34px,6vw,52px);font-weight:700;color:#fff;text-align:center;line-height:1}
.board .meta{font-size:14px;color:#c9d3cd;border-top:1px dashed #3a3f3c;padding-top:8px;margin-top:6px}
.board+.board{margin-top:12px}

/* entries */
.entries{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}

.entry.e1{border-top:5px solid var(--gold)}.entry.e2{border-top:5px solid var(--g)}.entry.e3{border-top:5px solid var(--k)}
/* lists */
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(18px,3vw,36px)}

.list{list-style:none;margin:0;padding:0}
.list li{border-bottom:1px solid var(--line)}

.list .d{font-size:13px;color:var(--mute);white-space:nowrap}
.list .t{font-weight:700}
.list .s{grid-column:2;font-size:13px;color:var(--mute)}
.nw{white-space:nowrap}
.recs{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.rec{background:#111;color:#fff;border-radius:10px;padding:12px 16px;border-left:5px solid var(--gold,#F2C200)}
.rec.all{background:var(--g)}
.rec span{display:block;font-size:13px;color:#ccc}.rec.all span,.rec.all small{color:#e6f4ee}
.rec b{display:block;font-size:26px;line-height:1.3}
.rec small{display:block;font-size:11px;color:#999}
.tl{list-style:none;margin:0;padding:0 0 0 18px;border-left:3px solid var(--line)}
.tl li{position:relative;padding:10px 0 14px 16px}
.tl li::before{content:'';position:absolute;left:-27px;top:16px;width:12px;height:12px;border-radius:50%;background:var(--card);border:3px solid var(--g)}
.tl li.imp::before{background:var(--gold,#F2C200);border-color:var(--g);width:16px;height:16px;left:-29px;top:14px}
.tl .y{font-weight:800;color:var(--g);font-size:15px;margin-right:8px}
.tl h4{display:inline;font-size:16px;margin:0}
.tl li.imp h4{font-size:18px}
.tl p{margin:4px 0 0;color:var(--ink);font-size:14.5px;line-height:1.7}
.tl .src{font-size:11.5px;color:var(--mute,#888);margin-top:2px}
.tl .k-ラグビー界 h4,.tl .k-社会 h4{font-weight:600}
.tldec{margin:28px 0 6px;font-size:20px;display:flex;align-items:baseline;gap:10px;scroll-margin-top:80px}
.tldec small{font-size:13px;color:var(--mute,#888);font-weight:400}
.chip{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--bg2);color:var(--g);margin-right:6px;vertical-align:2px;border:1px solid var(--line)}
.alt{background:var(--bg2)}
/* members */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.filters button{font:inherit;font-size:14px;min-height:40px;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.filters button[aria-pressed=true]{background:var(--g);color:#fff;border-color:var(--g)}
.filters input{font:inherit;font-size:16px;min-height:40px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);flex:1 1 180px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(160px,100%),1fr));gap:12px}
.mcard{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.av{aspect-ratio:1/1;background:linear-gradient(160deg,#00965E,#00643f);display:grid;place-items:center;color:#fff;font-weight:900;font-size:34px;position:relative}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 20%}
.av .no{z-index:1;background:rgba(0,0,0,.55);padding:0 5px;border-radius:3px}
.av .no{position:absolute;left:8px;top:6px;font-size:13px;color:var(--gold)}
.mcard .b{padding:10px 12px}.mcard b{display:block}.mcard .p{font-size:13px;color:var(--mute)}
@media(max-width:600px){.mgrid{grid-template-columns:minmax(0,1fr);gap:8px}.mgrid .mcard{display:grid;grid-template-columns:72px minmax(0,1fr);align-items:center}.mgrid .av{font-size:24px}.mgrid .av .no{font-size:12px;left:5px;top:2px}.mgrid .mcard .b{padding:8px 12px}}
/* tables */
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:13px;color:var(--mute);font-weight:700;background:var(--bg2)}
td.r,th.r{text-align:right}
.scoretbl td,.scoretbl th{text-align:center}
/* match rows */
.mrow{display:grid;grid-template-columns:5.5em minmax(0,1fr) auto;gap:4px 14px;align-items:center;padding:14px 4px;border-bottom:1px solid var(--line);text-decoration:none}
.mrow .dt{font-weight:700;line-height:1.25}.mrow .dt small{display:block;font-weight:400;color:var(--mute);font-size:12px}
.mrow .op{font-weight:700}.mrow .op small{display:block;font-weight:400;color:var(--mute);font-size:13px}
.mrow .res{font-size:22px;font-weight:700;white-space:nowrap}
.win{color:var(--g)}.lose{color:var(--mute)}
.tag{font-size:12px;font-weight:700;padding:2px 8px;border-radius:4px;background:var(--gold);color:#111;white-space:nowrap}
/* misc */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px}
details.faq{border-bottom:1px solid var(--line)}
details.faq summary{cursor:pointer;padding:14px 4px;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:10px;min-height:44px}
details.faq summary::after{content:"＋";color:var(--g)}details.faq[open] summary::after{content:"－"}
details.faq div{padding:0 4px 14px;color:var(--mute)}
.goal{display:flex;flex-wrap:wrap;gap:20px;align-items:center;background:var(--k);color:#fff;border-radius:10px;padding:20px 22px;border-left:6px solid var(--gold)}
.goal b{font-size:clamp(22px,3.4vw,34px);font-weight:900}
.histband{background:var(--k);color:#fff}
.histband .yr{font-size:clamp(56px,11vw,120px);line-height:.9;color:var(--gold);font-weight:700}
.histband .wrap{display:grid;grid-template-columns:auto minmax(0,1fr);gap:clamp(16px,4vw,48px);align-items:center}
@media(max-width:600px){.histband .wrap{grid-template-columns:minmax(0,1fr)}}
.plogos{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(150px,100%),1fr));gap:10px}
.plogo{min-height:96px;background:#fff !important;color:#111;display:grid;place-items:center;text-align:center;padding:10px 14px;border:1px solid var(--line);border-radius:8px;background:var(--card);font-weight:700;text-decoration:none}
.plogo small{display:block;font-weight:400;color:#5b6660;font-size:12px;margin-top:4px}.plogo:hover{border-color:var(--g)}
.article{max-width:760px}
.article .body{white-space:pre-wrap;font-size:16.5px;line-height:1.95;margin:18px 0}
.readtime{font-size:13px;color:var(--mute)}
.crumb{font-size:13px;color:var(--mute);margin-bottom:10px}.crumb a{color:var(--g)}
.pagehead{background:var(--g);color:#fff}
.pagehead h1{font-size:clamp(26px,4vw,40px);font-weight:900;margin:0}
.pagehead p{margin:6px 0 0;color:#dcefe6}
.tabs{display:flex;gap:6px;border-bottom:2px solid var(--line);margin-bottom:12px;overflow-x:auto}
.tabs button{font:inherit;font-weight:700;background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-2px;padding:10px 14px;min-height:44px;color:var(--mute);cursor:pointer;white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--ink);border-color:var(--g)}
/* admin */
.adm{border:2px dashed var(--g);border-radius:10px;padding:18px;background:var(--card)}
.steps{counter-reset:s;list-style:none;padding:0;margin:0}
.steps li{counter-increment:s;padding:10px 0 10px 44px;position:relative;border-bottom:1px solid var(--line)}
.steps li::before{content:counter(s);position:absolute;left:0;top:10px;width:30px;height:30px;border-radius:50%;background:var(--g);color:#fff;display:grid;place-items:center;font-weight:700}
.field{display:grid;gap:6px;margin-bottom:12px}
.field label{font-size:14px;font-weight:700}
.field input,.field textarea,.field select{font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.log{font-size:14px;background:var(--bg2);border-radius:8px;padding:12px;margin-top:10px}
.log .ng{color:#c0392b}.log .ok{color:var(--g)}
.notice{background:light-dark(#fff8d6,#2a2510);border-left:4px solid var(--gold);padding:10px 14px;border-radius:4px;font-size:14px;margin:10px 0}
footer{background:var(--k);color:#cfd6d2;font-size:14px}
footer .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(170px,100%),1fr));gap:18px}
footer a{color:#fff;text-decoration:none;display:block;padding:4px 0}
footer h4{color:var(--gold);margin:0 0 6px;font-size:14px}
.baton{display:grid;grid-template-columns:72px minmax(0,1fr);align-items:center}.baton .av{font-size:24px}.baton .p a{color:var(--g)}
.vcard{display:block;text-decoration:none;position:relative;padding-right:84px;min-height:110px}.vcard:hover{border-color:var(--g)}.vface{position:absolute;right:14px;top:14px;width:60px;height:60px;border-radius:50%;object-fit:cover;object-position:50% 20%}
.qa{margin:0}.qa dt{font-size:13px;color:var(--mute);margin-top:10px}.qa dd{margin:2px 0 0;font-weight:700}
@media(max-width:600px){.pgrid{grid-template-columns:minmax(0,1fr)!important}.pgrid>.mcard{max-width:200px}}
.skip{position:absolute;left:-999px;top:0;z-index:50;background:var(--gold);color:#111;padding:8px 12px}.skip:focus{left:8px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr));gap:10px}
.stat{background:var(--k);color:#fff;border-radius:10px;padding:12px 16px;border-left:5px solid var(--gold)}
.stat span{display:block;font-size:12px;color:#bbb}.stat b{display:block;font-size:24px;line-height:1.3}.stat small{display:block;font-size:11px;color:#999}
a.rec{text-decoration:none;color:#fff}a.rec:hover{outline:2px solid var(--gold)}
@media(max-width:600px){table.mt thead{display:none}table.mt tr{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:0 10px;padding:9px 0;border-bottom:1px solid var(--line)}table.mt td{border:0;padding:0}table.mt td:nth-child(3){grid-column:2/4;grid-row:2;font-size:12px;color:var(--mute)}}
.sns{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}.sns a{display:inline-block;border:1px solid #444;border-radius:999px;padding:4px 12px}
@media(max-width:600px){.stack thead{display:none}.stack tr{display:grid;padding-block:8px;border-bottom:1px solid var(--line)}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:6em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:5.5em;margin-inline-start:-6em;color:var(--mute);font-size:12px}.stack td:empty{display:none}}
@media (prefers-reduced-motion:no-preference){main{animation:fade .35s ease}@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}}
</style>

  const dz=document.getElementById('drafts');
  dz.innerHTML=D.drafts.length?D.drafts.map(({sheet,r},i)=>`<div class="card" style="margin-bottom:8px"><span class="chip">${sheet}</span><b>${esc(r['タイトル'])}</b><div class="small mute">${r['執筆者ID']?auName(r):esc(r['投稿者']||'')} ${fd(r['投稿日時']||r['日付'])}</div><button class="btn ghost" data-i="${i}" style="margin-top:8px">公開にする（この画面だけ）</button></div>`).join(''):'<p class="mute">承認待ちはありません。</p>';
  dz.querySelectorAll('button').forEach(b=>b.onclick=()=>{const d=D.drafts[+b.dataset.i];d.r['公開']='公開';commit('「'+d.r['タイトル']+'」を公開にしました');});
  document.getElementById('df').onsubmit=e=>{e.preventDefault();const v=id=>document.getElementById(id).value.trim();
    const now=new Date(),p=n=>String(n).padStart(2,'0');
    (RAW['日記']=RAW['日記']||[]).push({'投稿日時':`${now.getFullYear()}-${p(now.getMonth()+1)}-${p(now.getDate())}T${p(now.getHours())}:${p(now.getMinutes())}`,'記事ID':'new'+Date.now(),'執筆者ID':v('da'),'タイトル':v('dt'),'本文':v('db'),'次の走者ID':v('dn'),'公開':'下書き'});
    commit('下書きを追加しました（承認待ちに表示）');};
  document.getElementById('xf').onchange=async e=>{const f=e.target.files[0];if(!f)return;const log=document.getElementById('log');
    if(!(await needXLSX())){log.innerHTML='<span class="ng">読み込み用ライブラリを取得できませんでした（ネットワーク接続を確認してください）。</span>';return}
    try{const wb=XLSX.read(await f.arrayBuffer(),{cellDates:true});load(fromWorkbook(wb),f.name)}catch(err){log.innerHTML='<span class="ng">読み込めませんでした：'+esc(err.message)+'</span>'}};
  document.getElementById('gsb').onclick=async()=>{const id=document.getElementById('gs').value.trim().replace(/.*\/d\//,'').replace(/\/.*/,'');if(!(await needXLSX()))return;const log=document.getElementById('log');
    if(!id){log.innerHTML='<span class="ng">IDを入力してください。</span>';return}
    try{const r=await fetch(`https://docs.google.com/spreadsheets/d/${encodeURIComponent(id)}/export?format=xlsx`);if(!r.ok)throw new Error('HTTP '+r.status);
      load(fromWorkbook(XLSX.read(await r.arrayBuffer(),{cellDates:true})),'Googleスプレッドシート')}catch(err){log.innerHTML='<span class="ng">取得できませんでした（'+esc(err.message)+'）。共有設定が「リンクを知っている全員」になっているか，本番サーバー上で開いているかを確認してください。</span>'}};
  document.getElementById('rs').onclick=()=>{RAW=JSON.parse(JSON.stringify(DEFAULT));try{localStorage.removeItem('turfc-data')}catch(e){}D=model(RAW);render();document.getElementById('log').innerHTML='<span class="ok">初期データに戻しました。</span>'};
}
const pad=n=>String(n).padStart(2,'0');
const needXLSX=()=>window.XLSX?Promise.resolve(true):new Promise(ok=>{const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';sc.onload=()=>ok(true);sc.onerror=()=>ok(false);document.head.appendChild(sc)});
function cellVal(v){if(v instanceof Date){if(v.getFullYear()<1901)return `${pad(v.getHours())}:${pad(v.getMinutes())}`;const t=v.getHours()||v.getMinutes()?`T${pad(v.getHours())}:${pad(v.getMinutes())}`:'';return `${v.getFullYear()}-${pad(v.getMonth()+1)}-${pad(v.getDate())}${t}`}return v}
function fromWorkbook(wb){const out={};wb.SheetNames.forEach(n=>{if(n==='使い方')return;out[n]=XLSX.utils.sheet_to_json(wb.Sheets[n],{defval:''}).map(r=>{const o={};for(const k in r)o[String(k).trim()]=cellVal(r[k]);return o}).filter(r=>Object.values(r).some(v=>String(v).trim()!==''))});return out}
function load(raw,src){const msgs=[];
  Object.keys(REQ).forEach(n=>{if(!raw[n]){msgs.push(`<span class="ng">「${n}」シートがありません</span>`);return}const bad=raw[n].map((r,i)=>ok(n,r)?0:i+2).filter(Boolean);msgs.push(bad.length?`<span class="ng">${n}：${bad.length}行に必須項目の空欄（${bad.slice(0,8).join(', ')}行目）→ 表示しません</span>`:`<span class="ok">${n}：${raw[n].length}行</span>`)});
  RAW=raw;commit();const log=document.getElementById('log');if(log)log.innerHTML=`<b>${esc(src)}を読み込みました</b><br>`+msgs.join('<br>');}
function commit(msg){try{localStorage.setItem('turfc-data',JSON.stringify({built:DEFAULT_PACKED.built,raw:RAW}))}catch(e){}D=model(RAW);const log=document.getElementById('log')?.innerHTML;render();if(log)document.getElementById('log').innerHTML=log;if(msg)document.getElementById('log').innerHTML=`<span class="ok">${esc(msg)}</span>`}

/* ---------- 枠 ---------- */
function chrome(cur){
  const eu=imgU(D.cfg['部章URL']);if(eu)document.getElementById('emb').innerHTML=`<img src="${eu}" alt="部章">`;
  document.getElementById('gnav').innerHTML=NAV.slice(1).map(([k,j])=>`<a href="#${k}" class="${cur===k?'on':''}">${j}</a>`).join('');
  document.getElementById('dnav').innerHTML=NAV.map(([k,j,e])=>`<a href="#${k}">${j}<small>${e}</small></a>`).join('')+`<a href="#admin">サイトの更新<small>部員・スタッフ向け</small></a>`;
  document.getElementById('fcols').innerHTML=[
   ['試合・チーム',[['match','試合日程・結果'],['team','体制・部員紹介'],['history','歴史・歴代']]],
   ['読む',[['stories','お知らせ'],['stories-diary','リレー日記'],['stories-voice','Voice・特集']]],
   ['入部',[['join','入部希望の方へ'],['juken','受験生応援企画'],['contact','練習見学・お問い合わせ']]],
   ['応援・支援',[['partners','オフィシャルパートナー'],['goods','公式グッズ'],['admin','サイトの更新（部員向け）']]]].map(([h,l])=>`<div><h4>${h}</h4>${l.map(([k,t])=>`<a href="#${k}">${t}</a>`).join('')}</div>`).join('')
   +`<div><h4>SNS</h4>${[['X',D.cfg['X']],['Facebook',D.cfg['Facebook']],['新歓 X',D.cfg['新歓X']],['新歓 Instagram',D.cfg['新歓Instagram']]].filter(([,u])=>safeUrl(u)).map(([t,u])=>`<a href="${safeUrl(u)}" target="_blank" rel="noopener">${t} ↗</a>`).join('')}${safeUrl(D.cfg['OB倶楽部URL'])?`<a href="${safeUrl(D.cfg['OB倶楽部URL'])}"${extA(D.cfg['OB倶楽部URL'])}>OB倶楽部 会員サイト ↗</a>`:''}</div>`;
  document.getElementById('faddr').textContent=(D.cfg['住所']||'')+'　'+(D.cfg['最寄り駅']||'');
  document.getElementById('fy').textContent=new Date().getFullYear();
}
function render(){
  const h=(location.hash||'#home').slice(1);let html,cur=h.split('-')[0];
  if(h==='home'||h==='')html=V.home(),cur='home';
  else if(h.startsWith('match-'))html=V.matchDetail(h.slice(6)),cur='match';
  else if(h.startsWith('comp-'))html=V.comp(h.slice(5)),cur='match';
  else if(h.startsWith('season-'))html=V.match(h.slice(7)),cur='match';
  else if(h.startsWith('player-'))html=V.player(h.slice(7)),cur='team';
  else if(h.startsWith('news-'))html=V.news(h.slice(5)),cur='stories';
  else if(h.startsWith('diary-'))html=V.diary(h.slice(6)),cur='stories';
  else if(h==='stories-diary')html=V.stories('diary'),cur='stories';
  else if(h==='stories-voice')html=V.stories('voice'),cur='stories';
  else if(h.startsWith('partner-'))html=V.partner(h.slice(8)),cur='support';
  else if(h==='partners')html=V.partners(),cur='support';
  else if(h==='juken')html=V.juken(),cur='join';
  else if(h==='goods')html=V.goods(),cur='support';
  else if(h.startsWith('voice-'))html=V.voice(h.slice(6)),cur='stories';
  else if(V[h])html=V[h]();else html=V.notfound();
  document.getElementById('app').innerHTML=html;chrome(cur);
  document.querySelectorAll('table.stack').forEach(t=>{const hs=[...t.querySelectorAll('thead th')].map(x=>x.textContent);t.querySelectorAll('tbody tr').forEach(tr=>[...tr.children].forEach((td,i)=>{if(!td.dataset.l&&hs[i])td.dataset.l=hs[i]}))});
  const h1=document.querySelector('#app h1');document.title=(h==='home'||h===''?'':(h1?h1.textContent.trim()+'｜':''))+(D.cfg['部名']||'東京大学運動会ラグビー部');
  drawMembers();drawHist();drawAdmin();
  const cf=document.getElementById('cf');if(cf)cf.onsubmit=e=>{e.preventDefault();const v=id=>document.getElementById(id).value.trim();if(!v('cn')||!v('cb')){document.getElementById('cmsg').textContent='お名前と内容を入力してください。';return}const to=D.cfg['問い合わせメール']||'';location.href=`mailto:${to}?subject=${encodeURIComponent('【'+v('ck')+'】ホームページからのお問い合わせ')}&body=${encodeURIComponent(`お名前：${v('cn')}\nメール：${v('cm')}\nご用件：${v('ck')}\n\n${v('cb')}`)}`;document.getElementById('cmsg').textContent='メールソフトが開きます。開かない場合は '+to+' へ直接お送りください。'};
}
const dr=document.getElementById('drawer'),mb=document.getElementById('menuBtn');
const setD=o=>{dr.classList.toggle('open',o);mb.setAttribute('aria-expanded',o)};
mb.onclick=()=>setD(true);document.getElementById('shade').onclick=()=>setD(false);document.getElementById('closeBtn').onclick=()=>setD(false);
addEventListener('hashchange',()=>{setD(false);render();scrollTo(0,0)});
addEventListener('keydown',e=>{if(e.key==='Escape')setD(false)});
D=model(RAW);render();
}
</script>
</body>
